name: PR Checks

# 每次 PR / push 到 main 都跑「测试 + Xcode Debug 构建」的快速门禁。
# 不跑 DMG 打包 —— DMG 由 release.yml 在 release tag 或手动触发时单独跑。
# 这套拆分避免每个 PR 都白白生成一个没人会下载的 DMG，省 CI 时间和 macOS runner 配额。

on:
  push:
    branches: [main]
  pull_request:

# 同一 PR / 同一分支后续推送时取消正在跑的旧 run，减少 macOS runner 配额浪费。
# main 分支的 push 不取消，避免漏掉某次合并的验证。
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-and-build:
    name: SwiftPM tests + Xcode Debug build
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Verify Xcode version
        run: |
          xcodebuild -version
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"

      # SwiftLint 防漂移门禁：仓库现有违规已记入 swiftlint-baseline.json，这步只对**新增**违规报错。
      # 版本固定 0.64.1（必须与 baseline 生成时一致；换版本可能引入新默认规则 → 需 `scripts/lint.sh
      # regen-baseline` 重建基线再提交）。SwiftLint 经 sourcekit 工作，故放在「Select Xcode」之后。
      - name: SwiftLint (new-violation gate)
        run: |
          set -euo pipefail
          SWIFTLINT_VERSION=0.64.1
          curl -fsSL -o "$RUNNER_TEMP/portable_swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o -q "$RUNNER_TEMP/portable_swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint" version
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --strict

      # SwiftPM 的 build 产物可以跨 run 缓存，省一次完整 resolve + compile。
      # key 用 Package.swift + 所有参与 SwiftPM 编译的 .swift 路径的 hash，
      # 这样改动业务代码就 cache miss，但只动 README / 工作流之类的不会。
      - name: Cache SwiftPM build artifacts
        uses: actions/cache@v5
        with:
          path: /private/tmp/SimpleZipSwiftPM
          key: spm-${{ runner.os }}-xcode26.5-${{ hashFiles('Package.swift', 'SimpleZip/Core/**/*.swift', 'Tests/SimpleZipCoreTests/**/*.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode26.5-

      # Xcode derived data 也缓存。pbxproj + 全部源码 hash 作为 key。
      # 由于工程用了 Xcode 16+ 的 PBXFileSystemSynchronizedRootGroup，加文件不会改 pbxproj，
      # 单纯加文件的 PR 也能命中 derived data 的增量编译。
      - name: Cache Xcode derived data
        uses: actions/cache@v5
        with:
          path: /private/tmp/SimpleZipDerivedData
          key: derivedData-${{ runner.os }}-xcode26.5-${{ hashFiles('SimpleZip.xcodeproj/project.pbxproj', 'SimpleZip/**/*.swift', 'Info.plist') }}
          restore-keys: |
            derivedData-${{ runner.os }}-xcode26.5-

      # 与 AGENTS.md 里的「daily 命令」字字对应。任何修改这条命令请同步更新 AGENTS.md。
      - name: Run SwiftPM core tests
        run: |
          /usr/bin/env DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
            /usr/bin/xcrun swift test \
            --scratch-path /private/tmp/SimpleZipSwiftPM \
            -Xswiftc -module-cache-path -Xswiftc /private/tmp/SimpleZipSwiftPM/ModuleCache

      # 签名(独立 AI 进程改造引入):Debug 配置在 pbxproj 里把 app + SimpleZipAIAgent + SimpleZipAIXPCService 的
      # CODE_SIGN_IDENTITY 钉成本地自签证书「SimpleZip Dev」(SMAppService 要 app 与 helper 同签名身份;内嵌前台
      # XPC Service 随 app 一起 build/embed/签名,extra_args 是全局 override 会一并覆盖它)。CI runner 没有这个证书,
      # 故先尝试从 secret 导入 .p12 到临时钥匙串,用工程里的 Manual 签名签上;**secret 不存在时(还没配 / fork PR
      # 拿不到 secret)自动回落 ad-hoc(-)签名**,保证 CI 不因缺证书而红。需在仓库
      # Settings → Secrets and variables → Actions 配两个 secret:
      #   DEV_SIGNING_CERT_P12_BASE64 = 导出的「SimpleZip Dev」.p12 经 `base64 -i cert.p12 | pbcopy` 后的内容
      #   DEV_SIGNING_CERT_PASSWORD   = 导出 .p12 时设的密码
      - name: Prepare code signing
        id: signing
        env:
          DEV_CERT_P12_BASE64: ${{ secrets.DEV_SIGNING_CERT_P12_BASE64 }}
          DEV_CERT_PASSWORD: ${{ secrets.DEV_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${DEV_CERT_P12_BASE64:-}" ]]; then
            echo "未配置 SimpleZip Dev 证书 secret → Debug 构建回落 ad-hoc(-)签名(仍走完嵌入 helper 全流程)。"
            echo "extra_args=CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= CODE_SIGNING_ALLOWED=YES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "导入「SimpleZip Dev」证书到临时钥匙串,Debug 用工程里的 Manual 签名。"
          CERT_PATH="$RUNNER_TEMP/simplezip_dev.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/simplezip-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$DEV_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$DEV_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "extra_args=" >> "$GITHUB_OUTPUT"

      # 跟 AGENTS.md 里「UI / Xcode 工程 / Info.plist / 资源 / 本地化 / app-target 改动需要再跑」
      # 那条命令一致。PR 不区分到底改了什么，统一跑 Debug 构建作为最简验证。
      # Debug 配置的 PRODUCT_NAME 是 SimpleZip-dev(与发布版 SimpleZip 区分,配合 .dev bundle id 一起隔离),
      # 故产物是 SimpleZip-dev.app;这步只编不引用产物路径,改名不影响。
      - name: Build SimpleZip-dev.app (Debug)
        run: |
          /usr/bin/env DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
            /usr/bin/xcodebuild \
            -project SimpleZip.xcodeproj \
            -scheme SimpleZip \
            -configuration Debug \
            -derivedDataPath /private/tmp/SimpleZipDerivedData \
            ${{ steps.signing.outputs.extra_args }} \
            build
