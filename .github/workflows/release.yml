name: Release DMG

# 打 unsigned DMG 并（按需）发布 GitHub release。
# 慢任务（RAR 后端拉取 + Release 配置构建 + 公证准备 + 上传 artifact）只在这里跑，
# 不像之前 build-dmg.yml 那样每个 PR 都执行 —— 那个工作流已被 pr.yml 接管。
#
# 触发方式：
#   1. push tag v* —— 自动按 tag 名解析版本号、自动发布 release；
#   2. workflow_dispatch —— 仓库 Actions 页面手动触发，可选发布。
# 不再监听 main 的 push / pull_request。

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release after building
        type: boolean
        required: true
        default: false
      version:
        description: Release version, for example 0.1.0 (required if publishing)
        type: string
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build unsigned macOS DMG
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Verify Xcode version
        run: |
          xcodebuild -version
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"

      # 即便 pr.yml 已经替每个改动跑过测试，这里再跑一遍是为了「释放管道」时再确认一次：
      # release 走的是 Release 配置、可能改动了 RAR 依赖，单元测试又快又便宜，
      # 是发版前最后一道防线。
      - name: Run SwiftPM core tests
        run: |
          /usr/bin/env DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
            /usr/bin/xcrun swift test \
            --scratch-path /private/tmp/SimpleZipSwiftPM \
            -Xswiftc -module-cache-path -Xswiftc /private/tmp/SimpleZipSwiftPM/ModuleCache

      - name: Install RAR backend
        run: ./scripts/install_rar_backend.sh

      # 三条路径：
      #   tag push (v0.1.0) ──> publish=true, version=0.1.0
      #   manual + publish=true + version='X.Y' ──> publish=true, version=X.Y
      #   manual + publish=false ──> publish=false, version 不参与
      - name: Resolve release options
        id: release
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]]; then
              echo "Tag '$tag' is not in the form v0.1.0 / v1.2; refusing to publish." >&2
              exit 1
            fi
            version="${tag#v}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          publish_release="$PUBLISH_RELEASE"
          version="$RELEASE_INPUT_VERSION"

          if [[ "$publish_release" != "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$version" ]]; then
            echo "A version is required when publishing a release." >&2
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Version must look like 0.1.0 or 1.2." >&2
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build unsigned DMG
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          # bundled RAR 必须存在，否则用户装上没法 SimpleZip 解压 RAR。
          REQUIRE_BUNDLED_RAR: "1"
        run: ./scripts/build_unsigned_dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleZip-unsigned-dmg
          path: artifacts/*.dmg
          if-no-files-found: error

      # **签名必须在发布之前**：sign_update + appcast 生成都先跑，任何一步失败（漏配 secret /
      # 找不到 sign_update / 签名为空）都会在 gh release create 之前 fail，绝不会留下「已公开但没签」的 release。
      # 用 Sparkle 自带的 sign_update 工具对 DMG 做 EdDSA 签名 ——
      # 私钥来自 GitHub Secret `SPARKLE_ED_PRIVATE_KEY`（base64-encoded ed25519 seed，
      # 本地用 `generate_keys --account simplezip-ci -x ...` 导出 → 粘到 secrets/actions/new）。
      # 公钥写在源仓 Info.plist 的 SUPublicEDKey（v0.1.10 起接入）。
      # 缺 secret 时 sign_update 会拒绝继续 —— 这正是想要的「漏配置直接 fail，不发不签的版本」。
      #
      # **sign_update binary 的位置**：build_unsigned_dmg.sh 用
      # `-derivedDataPath "$ROOT_DIR/.build/xcode-dmg"`，所以 Sparkle SPM artifact 会落在
      # `.build/xcode-dmg/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update`，
      # 而**不是** `~/Library/Developer/Xcode/DerivedData`（CI runner 上为空）。
      # 注意 Package.swift 没有 Sparkle 依赖，swift package resolve 救不了；
      # 必须依赖上一步 "Build unsigned DMG" 已经跑完触发 Xcode SPM resolve。
      - name: Sign DMG with Sparkle sign_update
        id: sign_update
        if: steps.release.outputs.publish == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_ED_PRIVATE_KEY}" ]]; then
            echo "ERROR: SPARKLE_ED_PRIVATE_KEY secret is not set on this repository." >&2
            echo "       See secrets/README.md for how to generate and upload the key." >&2
            exit 1
          fi

          DMG_PATH=$(ls artifacts/*.dmg | head -n1)

          # 跟 build_unsigned_dmg.sh 默认值保持一致。如果将来改那条 default，这里也要改。
          DERIVED_DATA_PATH="${DERIVED_DATA_PATH:-$GITHUB_WORKSPACE/.build/xcode-dmg}"
          SIGN_UPDATE="$DERIVED_DATA_PATH/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"

          if [[ ! -x "$SIGN_UPDATE" ]]; then
            # 兜底：找一下 derivedData 里别的可能路径（Sparkle 偶尔 artifact 目录命名变）。
            FOUND=$(find "$DERIVED_DATA_PATH" -path '*sparkle*/bin/sign_update' -type f 2>/dev/null | head -n1)
            if [[ -n "${FOUND:-}" ]]; then
              SIGN_UPDATE="$FOUND"
            else
              echo "ERROR: sign_update binary not found under $DERIVED_DATA_PATH." >&2
              echo "       This step depends on the previous 'Build unsigned DMG' step having" >&2
              echo "       resolved the Sparkle SPM dependency via Xcode. Package.swift has no" >&2
              echo "       Sparkle dependency, so swift package resolve cannot recover this." >&2
              exit 1
            fi
          fi

          # 私钥经由本步骤 step 级、被 GitHub 自动 mask 的 env var 传入（这是 Actions 官方推荐做法，
          # 避免把 secret 直接内联进脚本文本引发注入）；随即写到 chmod 600 的临时文件供 sign_update 读，
          # 用完立刻删。这样私钥**不会出现在命令行 / ps / 日志**里 —— 但它确实在本步骤的进程 env 中。
          PRIVATE_KEY_FILE=$(mktemp)
          chmod 600 "$PRIVATE_KEY_FILE"
          # 用 printf 避免 trailing newline 污染 base64 解码。
          printf '%s' "${SPARKLE_ED_PRIVATE_KEY}" > "$PRIVATE_KEY_FILE"

          # sign_update 输出形如：
          #   sparkle:edSignature="abc...==" length="12345"
          # 拼回 enclosure 标签时直接 echo 进 GITHUB_OUTPUT，下一步用。
          SIGN_OUTPUT=$("$SIGN_UPDATE" -f "$PRIVATE_KEY_FILE" "$DMG_PATH")
          rm -f "$PRIVATE_KEY_FILE"

          echo "sign_update output: $SIGN_OUTPUT"
          # 注入 outputs；下游用 ${{ steps.sign_update.outputs.attrs }} 直接拼。
          {
            echo "attrs<<EOF"
            echo "$SIGN_OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 仅在确认发布的路径里生成 / 更新 Sparkle appcast.xml ——
      # 「手动触发 + 不勾选 publish」时不会动 main 的 docs/appcast.xml，
      # 这正是用户「只在发布时才生成更新文件」的诉求。
      # enclosure 上的 sparkle:edSignature + length 来自上一步 sign_update（v0.1.10 起）。
      - name: Generate Sparkle appcast.xml
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          SIGN_ATTRS: ${{ steps.sign_update.outputs.attrs }}
        run: |
          set -euo pipefail
          mkdir -p docs
          DMG_PATH=$(ls artifacts/*.dmg | head -n1)
          DMG_NAME=$(basename "$DMG_PATH")
          PUB_DATE=$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")
          DOWNLOAD_URL="https://github.com/chiba233/SimpleZip/releases/download/v${RELEASE_VERSION}/${DMG_NAME}"

          # sign_update 已经吐出 length="..." sparkle:edSignature="..."，直接复用 ——
          # 比自己 stat 文件再拼字符串更稳（避免 length 跟签名时算的不一致）。
          if [[ -z "${SIGN_ATTRS:-}" ]]; then
            echo "ERROR: sign_update step output empty; refusing to publish unsigned appcast." >&2
            exit 1
          fi

          # **sparkle:version 必须是 CFBundleVersion 同款单调递增整数（= BUILD_NUMBER）**，
          # 不能用 marketing 字符串。否则 0.1.7 用户本地 CFBundleVersion="<小整数>" 跟 feed
          # sparkle:version="0.1.8" 比较时 SUStandardVersionComparator 解析成
          # [小整数] vs [0,1,8]，第一段 N>0 → 本地误判为「更新」→ 永远收不到升级提示。
          # sparkle:shortVersionString 才是 UI 文案，用 marketing 字符串。
          cat > docs/appcast.xml <<APPCAST_EOF
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
              <channel>
                  <title>SimpleZip Updates</title>
                  <link>https://github.com/chiba233/SimpleZip</link>
                  <description>SimpleZip macOS release feed</description>
                  <language>en</language>
                  <item>
                      <title>SimpleZip ${RELEASE_VERSION}</title>
                      <link>https://github.com/chiba233/SimpleZip/releases/tag/v${RELEASE_VERSION}</link>
                      <pubDate>${PUB_DATE}</pubDate>
                      <enclosure
                          url="${DOWNLOAD_URL}"
                          sparkle:version="${BUILD_NUMBER}"
                          sparkle:shortVersionString="${RELEASE_VERSION}"
                          ${SIGN_ATTRS}
                          type="application/octet-stream"/>
                  </item>
              </channel>
          </rss>
          APPCAST_EOF

          echo "Generated docs/appcast.xml for v${RELEASE_VERSION}"
          cat docs/appcast.xml

      # 走到这里说明 DMG 已签名、appcast 已生成 —— 现在才创建公开 release，上传 DMG。
      # 任何成功的 tag push 都会发布；手动触发只有勾选了 publish 才走。
      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          # 幂等:release 已存在(重跑 / 补 appcast 场景)时不报错,改为覆盖上传 DMG 资产,
          # 让流程能继续走到「提交 appcast」那步,而不是卡在「release already exists」。
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "v$RELEASE_VERSION" artifacts/*.dmg --clobber
          else
            gh release create "v$RELEASE_VERSION" \
              artifacts/*.dmg \
              --title "SimpleZip $RELEASE_VERSION" \
              --notes "Unsigned ad-hoc signed macOS DMG. macOS Gatekeeper may warn because this build is not Developer ID signed or notarized."
          fi

      # 把 appcast.xml 推回 main，让 raw.githubusercontent.com/.../main/docs/appcast.xml 拿到新版。
      # Tag push 触发时 HEAD 是 detached（指 tag commit），先 checkout main 再 apply。
      # `git checkout -B main origin/main` 强制创建 / 重置本地 main 跟随远端 ——
      # 适用于 actions/checkout 默认只 fetch tag 引用的情况。
      - name: Commit appcast.xml to main
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # 保存生成出来的 appcast，等切换分支后还原回去。
          cp docs/appcast.xml /tmp/appcast.xml
          git fetch origin main
          # `-f`:第 11 步在工作区改了 docs/appcast.xml，而 tag commit ≠ origin/main 时切分支会换树，
          # git 会拒绝覆盖这个本地改动而 abort（v0.3.0 就是这么炸的）。已存到 /tmp，直接强制丢弃工作区改动。
          git checkout -f -B main origin/main
          mkdir -p docs
          cp /tmp/appcast.xml docs/appcast.xml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/appcast.xml
          if git diff --staged --quiet; then
            echo "appcast unchanged; skipping commit"
            exit 0
          fi
          git commit -m "ci: bump Sparkle appcast for v${RELEASE_VERSION}"
          git push origin main
