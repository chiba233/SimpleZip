name: Release DMG

# 构建 DMG 并（按需）签名、公证、发布 GitHub release。
# 慢任务（RAR 后端拉取 + Release 配置构建 + 公证准备 + 上传 artifact）只在这里跑，
# 不像之前 build-dmg.yml 那样每个 PR 都执行 —— 那个工作流已被 pr.yml 接管。
#
# 触发方式：
#   1. push tag v* —— 自动按 tag 名解析版本号、自动发布 release；
#   2. workflow_dispatch —— 仓库 Actions 页面手动触发，可选发布。
# 不再监听 main 的 push / pull_request。

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release after building
        type: boolean
        required: true
        default: false
      version:
        description: Release version, for example 0.1.0 (required if publishing)
        type: string
        required: false
      is_beta:
        description: Mark this release as a beta (Sparkle beta channel + GitHub prerelease)
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build macOS DMG
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Verify Xcode version
        run: |
          xcodebuild -version
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"

      # 即便 pr.yml 已经替每个改动跑过测试，这里再跑一遍是为了「释放管道」时再确认一次：
      # release 走的是 Release 配置、可能改动了 RAR 依赖，单元测试又快又便宜，
      # 是发版前最后一道防线。
      - name: Run SwiftPM core tests
        run: |
          /usr/bin/env DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
            /usr/bin/xcrun swift test \
            --scratch-path /private/tmp/SimpleZipSwiftPM \
            -Xswiftc -module-cache-path -Xswiftc /private/tmp/SimpleZipSwiftPM/ModuleCache

      - name: Install RAR backend
        run: ./scripts/install_rar_backend.sh

      # 三条路径：
      #   tag push (v0.1.0) ──> publish=true, version=0.1.0
      #   manual + publish=true + version='X.Y' ──> publish=true, version=X.Y
      #   manual + publish=false ──> publish=false, version 不参与
      - name: Resolve release options
        id: release
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          IS_BETA: ${{ inputs.is_beta || false }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            # 支持 v0.4.5 (stable) 和 v0.4.5-beta.1 / v0.4.5-rc.1 (beta)
            if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){1,2}(-(beta|rc)\.[0-9]+)?$ ]]; then
              echo "Tag '$tag' is not in a recognized form; refusing to publish." >&2
              exit 1
            fi
            version="${tag#v}"
            beta=false
            if [[ "$version" =~ -(beta|rc)\. ]]; then
              beta=true
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "beta=$beta" >> "$GITHUB_OUTPUT"
            echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          publish_release="$PUBLISH_RELEASE"
          version="$RELEASE_INPUT_VERSION"

          if [[ "$publish_release" != "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "beta=false" >> "$GITHUB_OUTPUT"
            echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$version" ]]; then
            echo "A version is required when publishing a release." >&2
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,2}(-(beta|rc)\.[0-9]+)?$ ]]; then
            echo "Version must look like 0.1.0 or 0.1.0-beta.1." >&2
            exit 1
          fi

          beta="$IS_BETA"
          # tag 名自带 -beta/-rc 时也自动识别
          if [[ "$version" =~ -(beta|rc)\. ]]; then
            beta=true
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "beta=$beta" >> "$GITHUB_OUTPUT"
          echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      # 把 Developer ID Application 证书导入临时钥匙串，供 build 步骤的 codesign 使用。
      # 仅在发布路径执行：手动「不发布」构建不签名，无需任何证书 secret。
      # 缺任一 secret 直接 fail —— 跟 Sparkle 私钥同款「漏配置就不发」策略，
      # 绝不留下「公开但没正确签名」的 release。
      - name: Import Developer ID signing certificate
        id: import_cert
        if: steps.release.outputs.publish == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          for v in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD MACOS_SIGN_IDENTITY; do
            if [[ -z "${!v:-}" ]]; then
              echo "ERROR: required secret $v is not set on this repository." >&2
              echo "       See secrets/README.md (Developer ID signing) for how to set it." >&2
              exit 1
            fi
          done

          KEYCHAIN_PATH="$RUNNER_TEMP/simplezip-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_P12="$RUNNER_TEMP/developer_id.p12"

          # secret 全程不进命令行 / 日志：base64 经 env 传入(GitHub 已 mask)，解码进 chmod 600
          # 临时文件，导入后立即删除。
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_P12"
          chmod 600 "$CERT_P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_P12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$CERT_P12"
          # 允许 codesign 非交互访问私钥。
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # 把临时钥匙串放进搜索列表，codesign 才能按身份名找到它。
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/"//g')

          # 校验证书确实导入 + 身份名跟 secret 完全一致（不一致就别浪费后面公证的时间）。
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
                | grep -qF "$MACOS_SIGN_IDENTITY"; then
            echo "ERROR: identity '$MACOS_SIGN_IDENTITY' not found in imported keychain." >&2
            echo "       Locally run: security find-identity -v -p codesigning" >&2
            echo "       and copy the exact 'Developer ID Application: …' name into the secret." >&2
            exit 1
          fi

          echo "identity=$MACOS_SIGN_IDENTITY" >> "$GITHUB_OUTPUT"

      # publish=true 时 SIGN_IDENTITY 非空 → build 脚本做 Developer ID 签名 + hardened runtime；
      # 非发布构建该值为空 → 脚本走 ad-hoc 签名（仅本地测试用）。
      - name: Build DMG
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          # bundled RAR 必须存在，否则用户装上没法 SimpleZip 解压 RAR。
          REQUIRE_BUNDLED_RAR: "1"
          SIGN_IDENTITY: ${{ steps.import_cert.outputs.identity }}
        run: ./scripts/build_dmg.sh

      # 公证 + 装订：把签好名的 DMG 提交给 Apple 公证服务，通过后把票「钉」进 DMG，
      # 这样离线的 Gatekeeper 也认、用户双击直接打开无警告。
      # **必须在 Sparkle sign_update 之前**：staple 改写 DMG 字节 → 改变 length 与 EdDSA 签名；
      # 顺序反了会让 appcast 里的签名跟最终上传的 DMG 对不上。
      # 缺任一 secret 直接 fail，绝不发出「签了名但没公证」的版本。
      - name: Notarize and staple DMG
        if: steps.release.outputs.publish == 'true'
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for v in AC_API_KEY_ID AC_API_ISSUER_ID AC_API_KEY_P8_BASE64; do
            if [[ -z "${!v:-}" ]]; then
              echo "ERROR: required secret $v is not set on this repository." >&2
              echo "       See secrets/README.md (Notarization) for how to set it." >&2
              exit 1
            fi
          done

          DMG_PATH="$(ls artifacts/*.dmg | head -n1)"
          KEY_P8="$RUNNER_TEMP/ac_api_key.p8"
          printf '%s' "$AC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_P8"
          chmod 600 "$KEY_P8"

          # --wait 阻塞到 Apple 出结论；失败时 notarytool 会打印 submission id，
          # 可用 `notarytool log <id>` 拉详细原因。
          if ! xcrun notarytool submit "$DMG_PATH" \
                --key "$KEY_P8" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" \
                --wait --timeout 30m; then
            echo "Notarization failed; inspect the notarytool output above." >&2
            rm -f "$KEY_P8"
            exit 1
          fi
          rm -f "$KEY_P8"

          # 把公证票钉进 DMG 并校验。stapler validate 是权威检查。
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          # 附加：Gatekeeper 实际放行评估（DMG 上偶尔挑剔，仅作信息，不作硬失败）。
          spctl --assess --type open --context context:primary-signature -vv "$DMG_PATH" || true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: SimpleZip-dmg
          path: artifacts/*.dmg
          if-no-files-found: error

      # **签名必须在发布之前**：sign_update + appcast 生成都先跑，任何一步失败（漏配 secret /
      # 找不到 sign_update / 签名为空）都会在 gh release create 之前 fail，绝不会留下「已公开但没签」的 release。
      # 用 Sparkle 自带的 sign_update 工具对 DMG 做 EdDSA 签名 ——
      # 私钥来自 GitHub Secret `SPARKLE_ED_PRIVATE_KEY`（base64-encoded ed25519 seed，
      # 本地用 `generate_keys --account simplezip-ci -x ...` 导出 → 粘到 secrets/actions/new）。
      # 公钥写在源仓 Info.plist 的 SUPublicEDKey（v0.1.10 起接入）。
      # 缺 secret 时 sign_update 会拒绝继续 —— 这正是想要的「漏配置直接 fail，不发不签的版本」。
      #
      # **sign_update binary 的位置**：build_dmg.sh 用
      # `-derivedDataPath "$ROOT_DIR/.build/xcode-dmg"`，所以 Sparkle SPM artifact 会落在
      # `.build/xcode-dmg/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update`，
      # 而**不是** `~/Library/Developer/Xcode/DerivedData`（CI runner 上为空）。
      # 注意 Package.swift 没有 Sparkle 依赖，swift package resolve 救不了；
      # 必须依赖前面的 "Build DMG" 步骤已经跑完触发 Xcode SPM resolve。
      - name: Sign DMG with Sparkle sign_update
        id: sign_update
        if: steps.release.outputs.publish == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_ED_PRIVATE_KEY}" ]]; then
            echo "ERROR: SPARKLE_ED_PRIVATE_KEY secret is not set on this repository." >&2
            echo "       See secrets/README.md for how to generate and upload the key." >&2
            exit 1
          fi

          DMG_PATH=$(ls artifacts/*.dmg | head -n1)

          # 跟 build_dmg.sh 默认值保持一致。如果将来改那条 default，这里也要改。
          DERIVED_DATA_PATH="${DERIVED_DATA_PATH:-$GITHUB_WORKSPACE/.build/xcode-dmg}"
          SIGN_UPDATE="$DERIVED_DATA_PATH/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"

          if [[ ! -x "$SIGN_UPDATE" ]]; then
            # 兜底：找一下 derivedData 里别的可能路径（Sparkle 偶尔 artifact 目录命名变）。
            FOUND=$(find "$DERIVED_DATA_PATH" -path '*sparkle*/bin/sign_update' -type f 2>/dev/null | head -n1)
            if [[ -n "${FOUND:-}" ]]; then
              SIGN_UPDATE="$FOUND"
            else
              echo "ERROR: sign_update binary not found under $DERIVED_DATA_PATH." >&2
              echo "       This step depends on the previous 'Build DMG' step having" >&2
              echo "       resolved the Sparkle SPM dependency via Xcode. Package.swift has no" >&2
              echo "       Sparkle dependency, so swift package resolve cannot recover this." >&2
              exit 1
            fi
          fi

          # 私钥经由本步骤 step 级、被 GitHub 自动 mask 的 env var 传入（这是 Actions 官方推荐做法，
          # 避免把 secret 直接内联进脚本文本引发注入）；随即写到 chmod 600 的临时文件供 sign_update 读，
          # 用完立刻删。这样私钥**不会出现在命令行 / ps / 日志**里 —— 但它确实在本步骤的进程 env 中。
          PRIVATE_KEY_FILE=$(mktemp)
          chmod 600 "$PRIVATE_KEY_FILE"
          # 用 printf 避免 trailing newline 污染 base64 解码。
          printf '%s' "${SPARKLE_ED_PRIVATE_KEY}" > "$PRIVATE_KEY_FILE"

          # sign_update 输出形如：
          #   sparkle:edSignature="abc...==" length="12345"
          # 拼回 enclosure 标签时直接 echo 进 GITHUB_OUTPUT，下一步用。
          SIGN_OUTPUT=$("$SIGN_UPDATE" -f "$PRIVATE_KEY_FILE" "$DMG_PATH")
          rm -f "$PRIVATE_KEY_FILE"

          echo "sign_update output: $SIGN_OUTPUT"
          # 注入 outputs；下游用 ${{ steps.sign_update.outputs.attrs }} 直接拼。
          {
            echo "attrs<<EOF"
            echo "$SIGN_OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 仅在确认发布的路径里更新 Sparkle appcast.xml ——
      # 「手动触发 + 不勾选 publish」时不会动 main 的 docs/appcast.xml。
      # stable：追加历史 item；beta：滚动替换（只保留最新一个 beta item）。
      # beta channel 用 <sparkle:channel>beta</sparkle:channel> item 子节点，不是 enclosure 属性。
      # enclosure 上的 sparkle:edSignature + length 来自上一步 sign_update（v0.1.10 起）。
      - name: Update Sparkle appcast.xml
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          SIGN_ATTRS: ${{ steps.sign_update.outputs.attrs }}
          IS_BETA: ${{ steps.release.outputs.beta }}
        run: |
          set -euo pipefail
          mkdir -p docs
          DMG_PATH=$(ls artifacts/*.dmg | head -n1)
          DMG_NAME=$(basename "$DMG_PATH")
          PUB_DATE=$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")
          DOWNLOAD_URL="https://github.com/chiba233/SimpleZip/releases/download/v${RELEASE_VERSION}/${DMG_NAME}"

          if [[ -z "${SIGN_ATTRS:-}" ]]; then
            echo "ERROR: sign_update step output empty; refusing to publish appcast without EdDSA signature." >&2
            exit 1
          fi

          # 构造新 <item> 块。
          # beta channel 用 item 子节点 <sparkle:channel>beta</sparkle:channel>，不是 enclosure 属性。
          # sparkle:version 必须是 CFBundleVersion 同款单调递增整数（= BUILD_NUMBER），
          # sparkle:shortVersionString 才是 UI 文案，用 marketing 字符串。
          NEW_ITEM="        <item>"
          NEW_ITEM="${NEW_ITEM}"$'\n'"            <title>SimpleZip ${RELEASE_VERSION}</title>"
          if [[ "$IS_BETA" == "true" ]]; then
            NEW_ITEM="${NEW_ITEM}"$'\n'"            <sparkle:channel>beta</sparkle:channel>"
          fi
          NEW_ITEM="${NEW_ITEM}"$'\n'"            <link>https://github.com/chiba233/SimpleZip/releases/tag/v${RELEASE_VERSION}</link>"
          NEW_ITEM="${NEW_ITEM}"$'\n'"            <pubDate>${PUB_DATE}</pubDate>"
          NEW_ITEM="${NEW_ITEM}"$'\n'"            <enclosure"
          NEW_ITEM="${NEW_ITEM}"$'\n'"                url=\"${DOWNLOAD_URL}\""
          NEW_ITEM="${NEW_ITEM}"$'\n'"                sparkle:version=\"${BUILD_NUMBER}\""
          NEW_ITEM="${NEW_ITEM}"$'\n'"                sparkle:shortVersionString=\"${RELEASE_VERSION}\""
          NEW_ITEM="${NEW_ITEM}"$'\n'"                ${SIGN_ATTRS}"
          NEW_ITEM="${NEW_ITEM}"$'\n'"                type=\"application/octet-stream\"/>"
          NEW_ITEM="${NEW_ITEM}"$'\n'"        </item>"

          # 从 origin/main 拿现有 appcast（tag push 时本地 checkout 的是 tag commit，
          # 不一定有 main 上最新的 appcast）。
          git fetch origin main 2>/dev/null || true
          if git show origin/main:docs/appcast.xml > /tmp/existing_appcast.xml 2>/dev/null; then
            EXISTING=/tmp/existing_appcast.xml
          else
            # 首次发布，无现有 appcast——用空壳。
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' \
              '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">' \
              '    <channel>' \
              '        <title>SimpleZip Updates</title>' \
              '        <link>https://github.com/chiba233/SimpleZip</link>' \
              '        <description>SimpleZip macOS release feed</description>' \
              '        <language>en</language>' \
              '    </channel>' \
              '</rss>' > /tmp/existing_appcast.xml
            EXISTING=/tmp/existing_appcast.xml
          fi

          # 删除 item 规则：
          #   1. 同版本 item 先删（幂等：重发同版本不会重复）。
          #   2. beta 发布时：删掉所有旧 beta item（滚动 feed，只保留最新一个 beta）。
          #      兼容 enclosure 属性写法（历史污染清理）和 item 子节点两种形式。
          awk -v ver="$RELEASE_VERSION" -v is_beta="$IS_BETA" '
            /<item>/ { buf=$0; in_item=1; next }
            in_item { buf=buf "\n" $0 }
            in_item && /<\/item>/ {
              in_item=0
              if (buf ~ "sparkle:shortVersionString=\"" ver "\"") { next }
              old_beta = (buf ~ "<sparkle:channel>beta</sparkle:channel>" || buf ~ "sparkle:channel=\"beta\"")
              if (is_beta == "true" && old_beta) { next }
              print buf
              next
            }
            !in_item { print }
          ' "$EXISTING" > /tmp/appcast_deduped.xml

          # 在 </channel> 前插入新 item。
          # 注意：awk -v 不支持多行字符串，先把 item 写临时文件再用 getline 读入。
          printf '%s\n' "$NEW_ITEM" > /tmp/new_item.xml
          awk '
            /<\/channel>/ {
              while ((getline line < "/tmp/new_item.xml") > 0) print line
              close("/tmp/new_item.xml")
            }
            { print }
          ' /tmp/appcast_deduped.xml > docs/appcast.xml

          # 防呆：channel 必须是 item 子节点，不能是 enclosure 属性（历史写法，Sparkle 不识别）。
          if grep -q 'sparkle:channel="' docs/appcast.xml; then
            echo "ERROR: invalid Sparkle channel syntax detected: use <sparkle:channel>beta</sparkle:channel> under <item>, not an enclosure attribute." >&2
            exit 1
          fi

          echo "Updated docs/appcast.xml for v${RELEASE_VERSION} (beta=$IS_BETA)"
          cat docs/appcast.xml

      # 走到这里说明 DMG 已签名、appcast 已生成 —— 现在才创建公开 release，上传 DMG。
      # 任何成功的 tag push 都会发布；手动触发只有勾选了 publish 才走。
      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IS_BETA: ${{ steps.release.outputs.beta }}
        run: |
          set -euo pipefail

          # 从 CHANGELOG.md 提取当前版本的段落作为 release notes。
          NOTES=$(awk -v ver="$RELEASE_VERSION" '
            $0 ~ "^## " ver { found=1; next }
            found && /^## / { exit }
            found { buf = buf $0 "\n" }
            END { sub(/^\n+/, "", buf); sub(/\n+$/, "", buf); print buf }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES="SimpleZip $RELEASE_VERSION"
          fi

          PRERELEASE_FLAG=""
          if [[ "$IS_BETA" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # 幂等 + 自愈:
          #  - release 已存在(含草稿态)→ 覆盖上传 DMG + 强制重新发布。
          #  - 不存在 → 直接新建。
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "v$RELEASE_VERSION" artifacts/*.dmg --clobber
            gh release edit "v$RELEASE_VERSION" --draft=false --notes "$NOTES" $PRERELEASE_FLAG
          else
            gh release create "v$RELEASE_VERSION" \
              artifacts/*.dmg \
              --title "SimpleZip $RELEASE_VERSION" \
              --notes "$NOTES" \
              $PRERELEASE_FLAG
          fi

      # 把 appcast.xml 推回 main，让 raw.githubusercontent.com/.../main/docs/appcast.xml 拿到新版。
      # Tag push 触发时 HEAD 是 detached（指 tag commit），先 checkout main 再 apply。
      # `git checkout -B main origin/main` 强制创建 / 重置本地 main 跟随远端 ——
      # 适用于 actions/checkout 默认只 fetch tag 引用的情况。
      - name: Commit appcast.xml to main
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # 保存生成出来的 appcast，等切换分支后还原回去。
          cp docs/appcast.xml /tmp/appcast.xml
          git fetch origin main
          # `-f`:第 11 步在工作区改了 docs/appcast.xml，而 tag commit ≠ origin/main 时切分支会换树，
          # git 会拒绝覆盖这个本地改动而 abort（v0.3.0 就是这么炸的）。已存到 /tmp，直接强制丢弃工作区改动。
          git checkout -f -B main origin/main
          mkdir -p docs
          cp /tmp/appcast.xml docs/appcast.xml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/appcast.xml
          if git diff --staged --quiet; then
            echo "appcast unchanged; skipping commit"
            exit 0
          fi
          git commit -m "ci: bump Sparkle appcast for v${RELEASE_VERSION}"
          git push origin main
