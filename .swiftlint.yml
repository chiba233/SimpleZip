# SwiftLint 配置。本地跑 `npm run lint`（= scripts/lint-changed.sh）：只对「相对 main 有改动的行」报警，
# 历史代码一行不碰 —— 防止风格随协作漂移，又不被既有违规淹没。不走 baseline（SwiftLint 的 baseline 存绝对
# 路径、跨机器/CI 不可用）。这是开发期本地工具，**不参与 CI**。
#
# 阈值按本仓库实际风格放宽（长行、大文件、短惯用名是既有约定），只把明显跑偏的新代码挡下。
# 新违规出现时优先改代码；确属误报再在此调规则，或就地 `// swiftlint:disable:next <rule>` 局部豁免。

included:
  - SimpleZip
  - SimpleZipFinderExtension
  - SimpleZipUITests
  - Tests

excluded:
  - .build
  - SimpleZip/Tools
  - SimpleZip/Assets.xcassets
  - Tests/SimpleZipCoreTests/Fixtures

disabled_rules:
  - todo                      # 仓库里的 TODO / FIXME 是有意保留的待办，不当违规
  - trailing_comma            # 与现有多行字面量风格冲突，无实际价值

line_length:
  warning: 140
  error: 250
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

file_length:
  warning: 2000
  error: 3500
  ignore_comment_only_lines: true

type_body_length:
  warning: 1000
  error: 2000

function_body_length:
  warning: 140
  error: 320

cyclomatic_complexity:
  warning: 25
  error: 50

identifier_name:
  min_length: 1               # i / x / a / 闭包参数等惯用短名
  max_length:
    warning: 64
    error: 80

type_name:
  max_length:
    warning: 64
    error: 80
